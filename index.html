<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A-31 House — Architectural Digital Twin</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --bg: #090c10;
            --surface: rgba(18, 22, 28, 0.85);
            --border: rgba(255, 255, 255, 0.12);
            --text: #f0f6fc;
            --muted: #8b949e;
            --accent: #58a6ff;
            --edge: #388bfd;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

        #canvas-wrap { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        .material-symbols-rounded {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 20;
            font-size: 18px;
            vertical-align: middle;
        }

        /* Minimal Floating Header */
        .top-bar {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }
        .pill {
            pointer-events: auto;
            background: var(--surface);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
        .pill-title { color: var(--accent); font-weight: 600; }
        .pill-dims { color: var(--muted); font-size: 11px; }

        /* Minimal Bottom Floating Control */
        .bottom-bar {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: var(--surface);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            padding: 5px;
            border-radius: 24px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .ctrl-btn {
            background: transparent;
            color: var(--muted);
            border: none;
            padding: 6px 14px;
            border-radius: 18px;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .ctrl-btn:hover { color: #fff; background: rgba(255,255,255,0.06); }
        .ctrl-btn.active { background: #238636; color: #fff; }

        /* Crisp Corner Edge Tags */
        .edge-label {
            position: absolute;
            background: rgba(9, 12, 16, 0.85);
            border: 1px solid var(--border);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            color: var(--text);
            pointer-events: none;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            letter-spacing: 0.3px;
        }
        .edge-label b { color: var(--accent); }
    </style>
</head>
<body>
    <div id="canvas-wrap"></div>

    <div class="top-bar">
        <div class="pill">
            <span class="material-symbols-rounded notranslate" translate="no">apartment</span>
            <span class="pill-title">GF Guest Room</span>
            <span class="pill-dims">5.0m × 3.0m × 3.2m</span>
        </div>
        <div class="pill" id="compass-pill">
            <span class="material-symbols-rounded notranslate" translate="no">explore</span>
            <span id="heading-val">40° NE</span>
        </div>
    </div>

    <!-- Minimal Corner / Wall Edge Markers -->
    <div id="tag-ne" class="edge-label"><b>40° NE Wall</b> · 5.0m</div>
    <div id="tag-s" class="edge-label"><b>200° S Wall</b> · 5.0m</div>
    <div id="tag-sw" class="edge-label"><b>240° SW Wall</b> · 3.0m (Window)</div>
    <div id="tag-se" class="edge-label"><b>150° SE Wall</b> · 3.0m (Door)</div>

    <div class="bottom-bar">
        <button id="btn-view" class="ctrl-btn active" onclick="toggleView()">
            <span class="material-symbols-rounded notranslate" translate="no">person</span>
            Inside View
        </button>
        <button id="btn-cloud" class="ctrl-btn active" onclick="toggleCloud()">
            <span class="material-symbols-rounded notranslate" translate="no">grain</span>
            45k Points
        </button>
        <button id="btn-traj" class="ctrl-btn active" onclick="toggleTraj()">
            <span class="material-symbols-rounded notranslate" translate="no">route</span>
            Walk Path
        </button>
        <button id="btn-play" class="ctrl-btn" onclick="togglePlayback()">
            <span class="material-symbols-rounded notranslate" translate="no">play_arrow</span>
            Flythrough
        </button>
        <button class="ctrl-btn" onclick="toggleWireframe()">
            <span class="material-symbols-rounded notranslate" translate="no">grid_guides</span>
            Edges Only
        </button>
        <button class="ctrl-btn" onclick="resetCam()">
            <span class="material-symbols-rounded notranslate" translate="no">restart_alt</span>
            Reset
        </button>
    </div>

    <script>
        const wrap = document.getElementById('canvas-wrap');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x090c10);

        const L = 5.0; // Length (X)
        const W = 3.0; // Width (Z)
        const H = 3.2; // Height (Y)

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.05, 100);
        // Start inside standing at eye-level (1.6m) looking along room
        camera.position.set(0, 1.6, 0.1);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        wrap.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.target.set(0, 1.6, -1.0);
        controls.minDistance = 0.05;
        controls.maxDistance = 20;

        // Clean Soft Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.65));
        const ceilingLight = new THREE.PointLight(0xffffff, 0.6, 12);
        ceilingLight.position.set(0, H - 0.2, 0);
        scene.add(ceilingLight);

        // --- Crisp Box Room with True 90° Corner Edges ---
        // Clean Matte Wall Material
        const wallMat = new THREE.MeshStandardMaterial({
            color: 0x1f242d,
            roughness: 0.8,
            metalness: 0.1,
            side: THREE.BackSide
        });

        const roomBoxGeo = new THREE.BoxGeometry(L, H, W);
        const roomBox = new THREE.Mesh(roomBoxGeo, wallMat);
        roomBox.position.set(0, H / 2, 0);
        scene.add(roomBox);

        // Razor-Sharp Structural Corner Edges (No curved bubbles or stitching)
        const edgesGeo = new THREE.EdgesGeometry(roomBoxGeo);
        const edgesMat = new THREE.LineBasicMaterial({ color: 0x388bfd, linewidth: 2 });
        const roomEdges = new THREE.LineSegments(edgesGeo, edgesMat);
        roomEdges.position.copy(roomBox.position);
        scene.add(roomEdges);

        // Floor Plane (Subtle Dark Architectural Finish)
        const floorGeo = new THREE.PlaneGeometry(L, W);
        const floorMat = new THREE.MeshStandardMaterial({
            color: 0x161b22,
            roughness: 0.5,
            metalness: 0.2
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(0, 0.005, 0);
        scene.add(floor);

        // Crisp Floor Grid
        const grid = new THREE.GridHelper(Math.max(L, W), 10, 0x388bfd, 0x21262d);
        grid.position.set(0, 0.01, 0);
        scene.add(grid);

        // --- Architectural Openings & Furniture with Clean Edges ---
        // 1. Bed (74" x 83" x 21" mattress + 34" headboard) against 40° NE Wall
        const bW = 74 * 0.0254; // 1.88m
        const bL = 83 * 0.0254; // 2.11m
        const mH = 21 * 0.0254; // 0.53m
        const hH = 34 * 0.0254; // 0.86m
        const hD = 7 * 0.0254;  // 0.18m

        const bedGroup = new THREE.Group();
        const bedMat = new THREE.MeshStandardMaterial({ color: 0x2d333b, roughness: 0.6 });
        const bedEdgeMat = new THREE.LineBasicMaterial({ color: 0x58a6ff });

        const baseMesh = new THREE.Mesh(new THREE.BoxGeometry(bW, mH, bL), bedMat);
        baseMesh.position.y = mH / 2;
        const baseEdges = new THREE.LineSegments(new THREE.EdgesGeometry(baseMesh.geometry), bedEdgeMat);
        baseEdges.position.copy(baseMesh.position);
        bedGroup.add(baseMesh, baseEdges);

        const headMesh = new THREE.Mesh(new THREE.BoxGeometry(bW, hH, hD), bedMat);
        headMesh.position.set(0, hH / 2, -bL / 2 + hD / 2);
        const headEdges = new THREE.LineSegments(new THREE.EdgesGeometry(headMesh.geometry), bedEdgeMat);
        headEdges.position.copy(headMesh.position);
        bedGroup.add(headMesh, headEdges);

        // Bed sits flush against 40° NE Wall (Z = -W/2 = -1.5m)
        bedGroup.position.set(0.3, 0, -W/2 + bL/2);
        scene.add(bedGroup);

        // 2. Window (6ft x 57" x 8" depth) on 240° SW Wall (X = -L/2 = -2.5m)
        const winW = 6 * 0.3048; // 1.83m
        const winH = 57 * 0.0254; // 1.45m
        const winBox = new THREE.Mesh(
            new THREE.BoxGeometry(0.1, winH, winW),
            new THREE.MeshStandardMaterial({ color: 0x388bfd, transparent: true, opacity: 0.25 })
        );
        winBox.position.set(-L/2 + 0.05, 0.48 + winH / 2, 0);
        const winEdges = new THREE.LineSegments(new THREE.EdgesGeometry(winBox.geometry), new THREE.LineBasicMaterial({ color: 0x58a6ff }));
        winEdges.position.copy(winBox.position);
        scene.add(winBox, winEdges);

        // 3. Door (40" x 7ft opening) on 150° SE Wall (X = L/2 = 2.5m)
        const doorW = 40 * 0.0254; // 1.02m
        const doorH = 7 * 0.3048;  // 2.13m
        const doorFrame = new THREE.LineSegments(
            new THREE.EdgesGeometry(new THREE.BoxGeometry(0.06, doorH, doorW)),
            new THREE.LineBasicMaterial({ color: 0x3fb950 })
        );
        doorFrame.position.set(L/2 - 0.03, doorH / 2, W/2 - doorW/2);
        scene.add(doorFrame);

        // 4. Ceiling Fan
        const fan = new THREE.Mesh(
            new THREE.CylinderGeometry(0.12, 0.12, 0.05, 16),
            new THREE.MeshStandardMaterial({ color: 0x484f58 })
        );
        fan.position.set(0, H - 0.25, 0);
        scene.add(fan);

        // --- Dynamic Edge Labels Tracking 3D Wall Corners ---
        const pNE = new THREE.Vector3(0, H * 0.65, -W/2);
        const pS  = new THREE.Vector3(0, H * 0.65, W/2);
        const pSW = new THREE.Vector3(-L/2, H * 0.65, 0);
        const pSE = new THREE.Vector3(L/2, H * 0.65, 0);

        const tagNE = document.getElementById('tag-ne');
        const tagS  = document.getElementById('tag-s');
        const tagSW = document.getElementById('tag-sw');
        const tagSE = document.getElementById('tag-se');

        function updateLabels() {
            function place(vec, el) {
                const p = vec.clone().project(camera);
                if (p.z > 1) { el.style.display = 'none'; return; }
                el.style.display = 'block';
                el.style.left = `${(p.x * 0.5 + 0.5) * window.innerWidth}px`;
                el.style.top = `${(-p.y * 0.5 + 0.5) * window.innerHeight}px`;
            }
            place(pNE, tagNE);
            place(pS,  tagS);
            place(pSW, tagSW);
            place(pSE, tagSE);
        }

        // Compass Heading
        const headingEl = document.getElementById('heading-val');
        function updateHeading() {
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            let deg = Math.round(Math.atan2(dir.x, -dir.z) * (180 / Math.PI));
            if (deg < 0) deg += 360;
            let card = 'N';
            if (deg >= 22.5 && deg < 67.5) card = 'NE';
            else if (deg >= 67.5 && deg < 112.5) card = 'E';
            else if (deg >= 112.5 && deg < 157.5) card = 'SE';
            else if (deg >= 157.5 && deg < 202.5) card = 'S';
            else if (deg >= 202.5 && deg < 247.5) card = 'SW';
            else if (deg >= 247.5 && deg < 292.5) card = 'W';
            else if (deg >= 292.5 && deg < 337.5) card = 'NW';
            headingEl.textContent = `${deg}° ${card}`;
        }

        // Camera Toggle: Inside Eye-Level vs Outside Orbit
        let inside = true;
        function toggleView() {
            const btn = document.getElementById('btn-view');
            inside = !inside;
            if (inside) {
                camera.position.set(0, 1.6, 0.1);
                controls.target.set(0, 1.6, -1.0);
                controls.minDistance = 0.05;
                btn.innerHTML = '<span class="material-symbols-rounded notranslate" translate="no">person</span> Inside View';
            } else {
                camera.position.set(5.5, 4.5, 6.0);
                controls.target.set(0, H / 2, 0);
                controls.minDistance = 1.0;
                btn.innerHTML = '<span class="material-symbols-rounded notranslate" translate="no">architecture</span> Orbit View';
            }
        }

        let wireOnly = false;
        function toggleWireframe() {
            wireOnly = !wireOnly;
            roomBox.visible = !wireOnly;
            floor.visible = !wireOnly;
        }

        // --- Live SfM Point Cloud & Walk Trajectory ---
        let pointCloud = null;
        let trajLine = null;
        let trajPoints = [];
        let isPlaying = false;
        let playIndex = 0;

        // Load 45k true-color spatial points
        fetch('rooms/ground_floor_guest_room/model_3d/sfm_points.bin')
            .then(res => res.arrayBuffer())
            .then(buf => {
                const view = new DataView(buf);
                const N = view.getUint32(0, true);
                const pos = new Float32Array(buf, 4, N * 3);
                const col = new Uint8Array(buf, 4 + N * 3 * 4, N * 3);
                const fCol = new Float32Array(N * 3);
                for (let i = 0; i < N * 3; i++) fCol[i] = col[i] / 255.0;

                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(fCol, 3));

                const mat = new THREE.PointsMaterial({
                    size: 0.028,
                    vertexColors: true,
                    sizeAttenuation: true
                });
                pointCloud = new THREE.Points(geo, mat);
                scene.add(pointCloud);
            })
            .catch(err => console.error("Could not load sfm points:", err));

        // Load 125 camera trajectory walkthrough points
        fetch('rooms/ground_floor_guest_room/model_3d/trajectory_scaled.json')
            .then(res => res.json())
            .then(data => {
                trajPoints = data.map(d => new THREE.Vector3(...d.pos));
                if (trajPoints.length > 1) {
                    const lineGeo = new THREE.BufferGeometry().setFromPoints(trajPoints);
                    const lineMat = new THREE.LineBasicMaterial({ color: 0x3fb950, linewidth: 3 });
                    trajLine = new THREE.Line(lineGeo, lineMat);
                    scene.add(trajLine);
                }
            })
            .catch(err => console.error("Could not load trajectory:", err));

        function toggleCloud() {
            const btn = document.getElementById('btn-cloud');
            if (!pointCloud) return;
            pointCloud.visible = !pointCloud.visible;
            btn.classList.toggle('active', pointCloud.visible);
        }

        function toggleTraj() {
            const btn = document.getElementById('btn-traj');
            if (!trajLine) return;
            trajLine.visible = !trajLine.visible;
            btn.classList.toggle('active', trajLine.visible);
        }

        function togglePlayback() {
            const btn = document.getElementById('btn-play');
            if (trajPoints.length < 2) return;
            isPlaying = !isPlaying;
            btn.classList.toggle('active', isPlaying);
            if (isPlaying) {
                playIndex = 0;
                btn.innerHTML = '<span class="material-symbols-rounded notranslate" translate="no">pause</span> Pause Walk';
            } else {
                btn.innerHTML = '<span class="material-symbols-rounded notranslate" translate="no">play_arrow</span> Flythrough';
            }
        }

        function resetCam() {
            isPlaying = false;
            document.getElementById('btn-play').classList.remove('active');
            document.getElementById('btn-play').innerHTML = '<span class="material-symbols-rounded notranslate" translate="no">play_arrow</span> Flythrough';
            if (inside) {
                camera.position.set(0, 1.6, 0.1);
                controls.target.set(0, 1.6, -1.0);
            } else {
                camera.position.set(5.5, 4.5, 6.0);
                controls.target.set(0, H / 2, 0);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);

            // Flythrough along actual reconstructed phone path
            if (isPlaying && trajPoints.length > 2) {
                playIndex = (playIndex + 0.15) % trajPoints.length;
                const currIdx = Math.floor(playIndex);
                const nextIdx = (currIdx + 1) % trajPoints.length;
                const lookIdx = (currIdx + 4) % trajPoints.length;
                const alpha = playIndex - currIdx;

                const currPos = trajPoints[currIdx];
                const nextPos = trajPoints[nextIdx];
                camera.position.lerpVectors(currPos, nextPos, alpha);

                controls.target.copy(trajPoints[lookIdx]);
            }

            controls.update();
            renderer.render(scene, camera);
            updateLabels();
            updateHeading();
        }
        animate();
    </script>
</body>
</html>
